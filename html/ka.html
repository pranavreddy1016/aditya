<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Expert Registration - Agricultural India</title>

    <link rel="stylesheet" href="/css/registration.css">

</head>

<body>

    <nav>

        <ul>

            <li>
                <a href="index.html">HOME</a>
            </li>

            <li>
                <a href="about.html">ABOUT</a>
            </li>

            <li>
                <a href="products.html">PRODUCTS</a>
            </li>

            <li>
                <a href="login.html">LOGIN</a>
            </li>

        </ul>

    </nav>


    <div class="form-container">

        <h1>🧠 Agriculture Expert Registration</h1>

        <p>
            Register as an agriculture knowledge person
            and help farmers with your expertise.
        </p>


        <form>


            <label>Full Name</label>

            <input type="text"
                placeholder="Enter your full name"
                required>


            <label>Mobile Number</label>

            <input type="tel"
                placeholder="Enter mobile number"
                required>


            <label>Email</label>

            <input type="email"
                placeholder="Enter email address"
                required>


            <label>Address</label>

            <textarea
                placeholder="Enter your address">
            </textarea>


            <label>Qualification</label>

            <input type="text"
                placeholder="Example: B.Sc Agriculture"
                required>


            <label>Specialization</label>

            <select required>

                <option value="">
                    Select specialization
                </option>

                <option>
                    Crop Science
                </option>

                <option>
                    Soil Science
                </option>

                <option>
                    Horticulture
                </option>

                <option>
                    Organic Farming
                </option>

                <option>
                    Agricultural Engineering
                </option>

                <option>
                    Dairy Farming
                </option>

                <option>
                    Plant Protection
                </option>

                <option>
                    Other
                </option>

            </select>


            <label>Experience</label>

            <select required>

                <option value="">
                    Select experience
                </option>

                <option>
                    Fresher
                </option>

                <option>
                    1 - 3 Years
                </option>

                <option>
                    3 - 5 Years
                </option>

                <option>
                    5 - 10 Years
                </option>

                <option>
                    10+ Years
                </option>

            </select>


            <label>About Your Expertise</label>

            <textarea
                rows="5"
                placeholder="Describe your knowledge and experience">
            </textarea>


            <label>Preferred Language</label>

            <select>

                <option>English</option>
                <option>Hindi</option>
                <option>Marathi</option>
                <option>Other</option>

            </select>


            <label>Username</label>

            <input type="text"
                placeholder="Create username"
                required>


            <label>Password</label>

            <input type="password"
                placeholder="Create password"
                required>


            <label>Confirm Password</label>

            <input type="password"
                placeholder="Confirm password"
                required>


            <label class="checkbox">

                <input type="checkbox" required>

                I agree to the Terms & Conditions

            </label>


            <button type="submit">
                Register as Expert
            </button>


        </form>

    </div>

</body>
</html>
