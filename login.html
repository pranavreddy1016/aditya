<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Agricultural India</title>

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

    <!-- Navbar -->

    <nav>
        <ul class="navbar">
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="products.html">PRODUCTS</a></li>
            <li><a href="contact.html">CONTACT</a></li>
        </ul>
    </nav>


    <!-- Login Section -->

    <section class="login-section">

        <div class="login-container">

            <div class="login-left">

                <h1>Agricultural India</h1>

                <h2>Welcome Back!</h2>

                <p>
                    Login to explore fresh agricultural products
                    and connect with farmers.
                </p>

                <p class="tagline">
                    Empowering Farmers. Connecting Customers.
                </p>

            </div>


            <div class="login-box">

                <h2>Login</h2>

                <p class="login-text">
                    Login to your account
                </p>

                <form>

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >


                    <div class="login-options">

                        <label class="remember">
                            <input type="checkbox">
                            Remember Me
                        </label>

                        <a href="#">Forgot Password?</a>

                    </div>


                    <button type="submit">
                        Login
                    </button>

                </form>


                <div class="register">

                    <p>
                        Don't have an account?
                        <a href="index.html">Create Account</a>
                    </p>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
