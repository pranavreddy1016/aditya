<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration - Agricultural India</title>
    <link rel="stylesheet" href="/css/registration.css">
</head>

<body>

    <nav>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="products.html">PRODUCTS</a></li>
            <li><a href="login.html">LOGIN</a></li>
        </ul>
    </nav>

    <div class="form-container">

        <h1>🌾 Farmer Registration</h1>
        <p>Register yourself to sell your agricultural products.</p>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>

            <label>Mobile Number</label>
            <input type="tel" placeholder="Enter mobile number" required>

            <label>Email</label>
            <input type="email" placeholder="Enter email address">

            <label>Address</label>
            <textarea placeholder="Enter your address"></textarea>

            <label>Village</label>
            <input type="text" placeholder="Enter village name" required>

            <label>District</label>
            <input type="text" placeholder="Enter district" required>

            <label>State</label>
            <input type="text" placeholder="Enter state" required>

            <label>Land Size (in acres)</label>
            <input type="number" placeholder="Enter land size">

            <label>Type of Farming</label>
            <select required>
                <option value="">Select farming type</option>
                <option>Organic Farming</option>
                <option>Crop Farming</option>
                <option>Vegetable Farming</option>
                <option>Fruit Farming</option>
                <option>Dairy Farming</option>
                <option>Other</option>
            </select>

            <label>Main Products</label>
            <input type="text"
                placeholder="Example: Wheat, Rice, Tomato">

            <label>Username</label>
            <input type="text" placeholder="Create username" required>

            <label>Password</label>
            <input type="password" placeholder="Create password" required>

            <label>Confirm Password</label>
            <input type="password"
                placeholder="Confirm password"
                required>

            <label class="checkbox">
                <input type="checkbox" required>
                I agree to the Terms & Conditions
            </label>

            <button type="submit">
                Register as Farmer
            </button>

        </form>

    </div>

</body>
</html>
